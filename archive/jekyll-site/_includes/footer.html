<footer style="padding:24px 16px; border-top:1px solid #eee; margin-top:32px;">
  <div style="display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
    <small>&copy; {{ site.title }} {{ site.time | date: '%Y' }}</small>
    <div style="display:flex; gap:12px; align-items:center;">
      <a href="mailto:{{ site.email }}" style="text-decoration:none;">Email</a>
      <a href="{{ "/feed.xml" | prepend: site.baseurl }}" style="text-decoration:none;">RSS</a>
    </div>
  </div>
</footer>
