<nav style="display:flex; align-items:center; justify-content:space-between; padding:12px 16px; border-bottom:1px solid #eee; position:sticky; top:0; background:#fff;">
  <a href="{{ site.baseurl }}/" title="HOME" style="display:flex; align-items:center; gap:8px; text-decoration:none; color:inherit;">
    <img src="{{ site.baseurl }}/logo.png" alt="logo" style="height:36px; width:auto;"/>
    <span style="font-weight:600;">{{ site.title }}</span>
  </a>
  <ul style="display:flex; gap:16px; list-style:none; margin:0; padding:0;">
    {% for nav_hash in site.nav %}
      {% for nav_item in nav_hash %}
        {% assign lowercase_nav_item = nav_item[0] | downcase %}
        <li>
          <a href="{{ nav_item[1] }}" style="text-decoration:none; color:inherit; font-weight:{% if page.active == lowercase_nav_item %}700{% else %}500{% endif %};">
            {{ nav_item[0] }}
          </a>
        </li>
      {% endfor %}
    {% endfor %}
  </ul>
</nav>
